# Test configuration for short simulation time to test packets in transit
scenario_name: test_short_sim

random_seed:
  seed_value: 42

system:
  width: 4
  height: 4
  downlink_number: 15
  uplink_number: 15
  interlink_capacity: 10000000
  demand_matrix_generation: "fixed"
  time_unit: "ms"

optimization:
  num_commodities: 2
  optimization_model: multicommodity
  max_hops: 7
  objective_func: 'minimize_max_flow'
  split_commodities: "on"

random_demand:
  minimum_flow_value: 2400
  maximum_flow_value: 2400
  max_priority: 3

fixed_demand:
  arrival_rate: [2400, 2400]
  priority: [1, 1]
  source: ['OBPModule(0, 0)_uplink_0', 'OBPModule(0, 1)_uplink_0']
  destination: ['OBPModule(3, 1)_downlink_0', 'OBPModule(3, 2)_downlink_0']

simulation:
  num_runs: 1
  simulation_time: 100  # Very short: 100ms to create packets in transit
  generation_finish_time: 100  # Same as simulation_time
  buffer_size: 15000
  obp_capacity: 1000
  fetchingAlgorithm: "fifo"
  brancher_type: "random"
  limit_bytes: True
  interarrival_time_generation: "exponential"
  packet_distribution_generation: "fixed"
  avg_packet_size: 1500.00
  max_failed_nodes: 0
  probability_failure: 0
  failures: []
  path_mode: "warm"
  failure_strategy: "fail-routing"
  backup_is_considered: 'off'
  re_routing_is_considered: 'off'
  backup: []

obp_port:
  infinite_capacity: False

interlink:
  infinite_capacity: False


